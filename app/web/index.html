<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Early warning for flash floods and landslides.">
  <meta name="theme-color" content="#0A0F1E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SIAGA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SIAGA</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Install support: keep the browser's install prompt for the app's own "Install app" button. It is set up before the
       app starts, because the browser can fire the event very early. -->
  <script>
    (function () {
      var deferred = null;
      function changed() { if (typeof window.siagaOnInstallChange === 'function') window.siagaOnInstallChange(); }
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; changed(); });
      window.addEventListener('appinstalled', function () { deferred = null; changed(); });
      window.siagaCanInstall = function () { return deferred !== null; };
      window.siagaIsInstalled = function () {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      };
      window.siagaIsIos = function () {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };
      window.siagaInstall = function () {
        if (!deferred) return Promise.resolve('unavailable');
        var d = deferred;
        deferred = null;
        d.prompt();
        return d.userChoice.then(function (c) { changed(); return c.outcome; });
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
