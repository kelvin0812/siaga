[project]
name = "siaga"
version = "0.1.0"
description = "SIAGA AIoT flash-flood and landslide early-warning system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "aiomqtt>=2.3",
    "h3>=4.1",
    "firebase-admin>=6.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["shared*", "backend*"]
